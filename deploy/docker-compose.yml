services:
  api:
    container_name: api-nexuschat
    build:
      context: ..
      dockerfile: deploy/api/Dockerfile
    ports:
      - "8050:8000"
    networks:
      - nexuschat

  nexuschat:
    container_name: site-nexuschat
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    ports:
      - "9000:80"
    networks:
      - nexuschat

networks:
  nexuschat:
    driver: bridge